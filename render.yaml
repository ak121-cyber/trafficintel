services:
  - type: web
    name: trafficintel-api
    runtime: python
    plan: free
    branch: main

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DATABASE
        value: trafficintel

      - key: JWT_SECRET
        sync: false
